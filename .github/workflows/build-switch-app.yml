name: Build Switch GPS APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --debug --flavor traccar --target lib/main.dart
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Switch-GPS-APK
          path: build/app/outputs/flutter-apk/app-traccar-debug.apk
