name: Compile Switch Tracking Production APK
on:
  push:
    branches: [ master, main ]

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Switch Source Code From Repository
      uses: actions/checkout@v4

    - name: Configure Java Infrastructure Context
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11' # Downgraded to Java 11 for perfect compatibility with Flutter 3.7 configurations

    - name: Setup Flutter Development Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.7.12' # Locked to match the exact requirement from the log output
        channel: 'stable'
        cache: true

    - name: Download App Package Dependencies
      run: flutter pub get

    - name: Execute Flutter Automated Compilation Build
      run: flutter build apk --debug

    - name: Route Native Binary Asset to Dashboard Directory
      uses: actions/upload-artifact@v4
      with:
        name: SwitchTrackingBinaryBuild
        path: build/app/outputs/flutter-apk/app-debug.apk
