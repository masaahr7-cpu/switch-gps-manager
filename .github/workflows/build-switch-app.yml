name: Compile Switch Tracking Production APK
on:
  push:
    branches: [ master, main ]

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Switch Source Code From Repository
      uses: actions/checkout@v4

    - name: Configure Java Infrastructure Context
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup Flutter Development Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.7.12'
        channel: 'stable'
        cache: true

    - name: Download App Package Dependencies
      run: |
        flutter pub get
        flutter pub run flutter_launcher_icons:main || true

    - name: Clean Local System Caches
      run: flutter clean

    - name: Execute Flutter Automated Compilation Build
      run: flutter build apk --debug

    - name: Route Native Binary Asset to Dashboard Directory
      uses: actions/upload-artifact@v4
      with:
        name: SwitchTrackingBinaryBuild
        path: build/app/outputs/flutter-apk/app-debug.apk
