
name: Build Switch GPS Manager
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Check files
        run: |
          ls -lh
          ls -lh tool/
          cat tool/brand.dart | head -20
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Fix icon path if needed
        run: |
          if [ ! -f "./icon.png" ]; then
            echo "icon.png not found at root, checking alternatives..."
            find . -name "icon.png" -o -name "*.png" | head -20
            cp -f tool/icon.png ./icon.png 2>/dev/null || cp -f icon.jpg ./icon.png 2>/dev/null || echo "No icon found"
          fi
          ls -lh icon.png
          
      - name: Run branding tool
        run: dart run tool/brand.dart
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Switch-GPS-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
